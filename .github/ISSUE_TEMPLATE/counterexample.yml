name: Counterexample
description: Report a reproducible boundary failure or challenge
title: "[Counterexample] "
labels: ["counterexample", "research"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Concise summary
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or reproduction
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Affected draft section
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-safe material
      options:
        - label: I included no private vault content, prompts, credentials, or absolute paths.
          required: true
